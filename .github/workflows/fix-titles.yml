name: Fix Clipboard Titles

on:
  schedule:
    # 避开整点/半点高峰, 每小时第17和47分钟运行
    - cron: "17,47 * * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  fix-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run title fixer
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_UNTITLED_VIEW_ID: ${{ secrets.NOTION_UNTITLED_VIEW_ID }}
        run: npm run fix-titles

